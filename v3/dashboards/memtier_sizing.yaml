- id: help
  type: TextDisplay
  title: "How to read this"
  coords: {x: 1, y: 25, w: 12, h: 34}
  html: "<div style=\"font-family:'Metropolis','Segoe UI',sans-serif;font-size:13px;line-height:1.45;padding:12px 14px;background:#2b3137;color:#e9edf0;border-radius:6px;border:1px solid #4a535d\"><h3 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Memory tiering sizing</h3>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffffff\">Click a cluster</b> in the top table; the hosts and powered-on VMs below follow it. Every\ncolumn covers the <b style=\"font-weight:700;color:#ffffff\">last 30 days</b>. <b style=\"font-weight:700;color:#ffffff\">Peak</b> = the highest 5-minute average in that window\n(Operations keeps no finer peak for memory). <b style=\"font-weight:700;color:#ffffff\">P95</b> = the value 95% of 5-minute samples stay under.\n<b style=\"font-weight:700;color:#ffffff\">Avg</b> = the 30-day mean. <b style=\"font-weight:700;color:#ffffff\">Now</b> = the latest sample.</p>\n\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffd79a\">vMotion and maintenance-mode spikes.</b> Measured on a lab: after a vMotion the\ndestination host counts the arriving VM's active memory at about <b style=\"font-weight:700;color:#ffffff\">double</b> for roughly\n<b style=\"font-weight:700;color:#ffffff\">10 minutes</b>, so the cluster's Guest Active reads high by about that VM's working set. A\nmaintenance-mode evacuation moves a whole host's VMs, so the cluster can read high by up to that host's\nactive memory for a similar time. The <b style=\"font-weight:700;color:#ffffff\">peak</b> may therefore be a migration artefact.\n<b style=\"font-weight:700;color:#ffffff\">P95</b> drops all short spikes, real or not. The vMotion columns are 30-day maxima with no time\nlink to the peak, so they only show that migrations happen. <b style=\"font-weight:700;color:#ffffff\">To decide:</b> open the cluster's\nMetrics chart and plot Memory | Guest Active with Summary | Number of vMotions over the same 30 days. If\nthe peak sits on a vMotion burst or maintenance window, size on P95; otherwise size on the peak.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Clusters</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffffff\">Running hosts / All hosts</b>: hosts connected and out of maintenance, and all hosts.\nInstalled memory and the sizing use <b style=\"font-weight:700;color:#ffffff\">Running hosts</b>: a host that is down or in maintenance\nreports no memory. <b style=\"font-weight:700;color:#ffffff\">Running VMs / All VMs</b>: All VMs includes powered-off VMs and templates.<br>\n<b style=\"font-weight:700;color:#ffffff\">Installed GB</b> (Memory | Total Capacity): physical DRAM in the cluster's hosts. On a host already\ntiered it would include the NVMe tier; on ESXi 8 it is DRAM.<br>\n<b style=\"font-weight:700;color:#ffffff\">Available to VMs GB</b> (Memory | Capacity Available to VMs): installed minus what ESXi keeps for itself.<br>\n<b style=\"font-weight:700;color:#ffffff\">Guest Active total</b> (Memory | Guest Active): the cluster's working set, the hosts' active\nmemory added together at the same moment. It is the basis of the DRAM figure. It is ESXi's sampled\nestimate and is <b style=\"font-weight:700;color:#ffffff\">not</b> the sum of the VMs' own Guest Active (hosts measure machine memory after\npage sharing). Shown as now, peak, P95 and average.<br>\n<b style=\"font-weight:700;color:#ffffff\">vMotions / DRS vMotions</b> (max per 5 min): migration activity; read it beside the active peak.<br>\n<b style=\"font-weight:700;color:#ffffff\">Consumed</b> (Memory | Consumed): host memory backing the guests. Includes memory the guest touched once\nand never released, so it is usually far above active. Cold memory = consumed minus active.<br>\n<b style=\"font-weight:700;color:#ffffff\">Memory usage %</b>: consumed as a share of capacity.<br>\n<b style=\"font-weight:700;color:#ffffff\">Worst VM mem contention %</b>: the worst any VM waited for memory. Non-zero means memory is already short.<br>\n<b style=\"font-weight:700;color:#ffffff\">Balloon, Swap-in/out rate, Compressed</b>: ESXi reclaiming memory today. Any non-zero value means the\ncluster is already short of DRAM; tier only after that is understood.<br>\n<b style=\"font-weight:700;color:#ffffff\">VM overhead</b>: memory ESXi uses to run the VMs; stays in DRAM.<br>\n<b style=\"font-weight:700;color:#ffffff\">CPU avg / peak %</b> (CPU | Capacity Usage), <b style=\"font-weight:700;color:#ffffff\">CPU used / demand MHz</b>, <b style=\"font-weight:700;color:#ffffff\">Worst VM CPU ready %</b>,\n<b style=\"font-weight:700;color:#ffffff\">VMs facing CPU ready %</b>: CPU headroom. Tiering only pays where memory runs out before CPU.<br>\n<b style=\"font-weight:700;color:#ffffff\">CPU contention %</b>: time VMs could not run because of the host (ready, co-stop, power management,\nhyperthreading). <b style=\"font-weight:700;color:#ffffff\">Worst VM CPU contention / co-stop %</b>: the worst VM. <b style=\"font-weight:700;color:#ffffff\">Memory contention %</b>\n(the % one of two metrics both called Memory | Contention; the other is KB): contended memory as a share of\nthe cluster's. It is diluted across the whole cluster, so <b style=\"font-weight:700;color:#ffffff\">VMs facing mem contention %</b> and the\nworst-VM column move first.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Hosts</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Only hosts that are connected and not in maintenance; a down host would otherwise add a blank row.\nThe same memory and CPU columns per host, to spot imbalance: a cluster that only fits because one host is\nnearly empty. Total row: installed GB.<br>\n<b style=\"font-weight:700;color:#ffffff\">CPU demand %</b>: what the VMs asked for as a share of the host. <b style=\"font-weight:700;color:#ffffff\">CPU contention %</b>,\n<b style=\"font-weight:700;color:#ffffff\">Worst VM CPU ready %</b>, <b style=\"font-weight:700;color:#ffffff\">VMs facing CPU ready %</b>, <b style=\"font-weight:700;color:#ffffff\">Worst VM co-stop %</b>,\n<b style=\"font-weight:700;color:#ffffff\">Memory contention %</b>: the host's pressure in percent. A host's own ready, IO wait and swap wait\nexist only as milliseconds summed over every vCPU, which cannot be compared between hosts, so they are\nnot shown. <b style=\"font-weight:700;color:#ffffff\">IO wait %</b> exists only per VM: see the VM table.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Powered-on VMs</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffffff\">Configured GB</b> (Memory | Total Capacity): memory given to the VM. The Total row is\n<b style=\"font-weight:700;color:#ffffff\">allocated</b>, the amount the tiered design must present. Powered-off VMs are excluded.<br>\n<b style=\"font-weight:700;color:#ffffff\">Guest Active peak</b>: per-VM Guest Active. <b style=\"font-weight:700;color:#ffd79a\">Not collected by default on 8.18</b>: blank until\nenabled in the policy (Operations &rarr; Configurations &rarr; Policy Definition &rarr; the Active policy &rarr; EDIT POLICY &rarr;\nMetrics and Properties &rarr; Virtual Machine &rarr; Memory | Guest Active (KB) &rarr; Activated &rarr; SAVE), and its history\nstarts then. Do not add per-VM peaks together: they happen at different times. Use the cluster total.<br>\n<b style=\"font-weight:700;color:#ffffff\">Non Zero Active peak</b>: collected by default, so it has the 30 days; use it per VM until Guest Active\nhas history.<br>\n<b style=\"font-weight:700;color:#ffffff\">Consumed peak</b>: host memory backing this VM.<br>\n<b style=\"font-weight:700;color:#ffffff\">Reserved used GB / Reservation / Memory limit</b>: a VM whose reservation equals its configured memory is\n<b style=\"font-weight:700;color:#ffd79a\">pinned to DRAM</b> and cannot be tiered; subtract it. Latency-sensitive VMs are also pinned and are not\nvisible here; check them by hand.<br>\n<b style=\"font-weight:700;color:#ffffff\">Host / Guest OS / vCPUs</b>: where it runs and what it is; vCPUs and Configured GB identify monster VMs.<br>\n<b style=\"font-weight:700;color:#ffffff\">Swapped, Swap-in rate, Compressed, Guest page-out 20s peak</b>: this VM is already short of memory.<br>\n<b style=\"font-weight:700;color:#ffffff\">Oversized / Undersized by</b>: Operations' right-sizing view of the VM.<br>\n<b style=\"font-weight:700;color:#ffffff\">Mem contention / CPU ready / co-stop 20s peak</b>: the worst moment inside a collection cycle.\n<b style=\"font-weight:700;color:#ffffff\">CPU ready avg %</b>: the 5-minute average beside it. <b style=\"font-weight:700;color:#ffffff\">CPU co-stop peak %</b>: a multi-vCPU VM held back\nso its vCPUs stay in step; high co-stop usually means too many vCPUs.<br>\n<b style=\"font-weight:700;color:#ffffff\">IO wait avg / 20s peak %</b> (vSphere's Other Wait), <b style=\"font-weight:700;color:#ffffff\">Swap wait %</b>: this VM stalled on storage or\nnetwork IO, or on swapped memory. High IO wait means the workload is IO-bound: guest-OS tools report that\ntime as busy CPU, so read CPU figures with it, and tiering memory will not fix it.<br>\n<b style=\"font-weight:700;color:#ffffff\">Worst disk read / write latency, Disk latency 20s peak</b>: the slowest of this VM's virtual disks.\nThese are measured in ESXi's storage stack, so they read the same on vSAN, VMFS (FC or iSCSI), NFS and\nvVols; datastore-level latency is not reported for vSAN VMs. High IO wait with high disk latency: the\nwait is storage, so open the VM's Metrics page to see which disk and datastore. High IO wait with low\ndisk latency: it is most likely network.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">The sizing</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Per cluster, A = Active peak (or P95, see above), H = Running hosts, V = VM Total configured GB, I = Installed GB,\n<b style=\"font-weight:700;color:#ffffff\">R = reserve</b> = Installed GB &minus; Available to VMs GB: the memory ESXi keeps for the hypervisor, vSAN\nand NSX, measured by Operations, resident and never tierable.\n<b style=\"font-weight:700;color:#ffffff\">VMware's rule</b>: active memory should be <b style=\"font-weight:700;color:#ffffff\">50% or less of DRAM</b>, so the\n<b style=\"font-weight:700;color:#ffffff\">recommended DRAM</b> = 2 &times; A + R. <b style=\"font-weight:700;color:#ffffff\">Floor</b> (1 &times; A + R) is the\nabsolute minimum and sits below VMware's guidance. <b style=\"font-weight:700;color:#ffffff\">Conservative</b> = 4 &times; A + R.\n<b style=\"font-weight:700;color:#ffffff\">NVMe needed</b> = V &minus; DRAM; per host it must stay under <b style=\"font-weight:700;color:#ffffff\">4,096 GB</b>.\n<b style=\"font-weight:700;color:#ffffff\">Retrofit headroom</b> = I &minus; DRAM: positive means NVMe alone is enough. Export the tables (Export as CSV) and <code style=\"font-family:monospace;background:#363d45;color:#8fd3ff;padding:1px 3px;border-radius:3px\">memtier_818_calc.py</code>\nprints all of it.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Hard to find in the Operations UI</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffffff\">20-second peaks</b>: Operations charts 5-minute averages; the worst moment inside each cycle is a\nseparate metric (CPU | 20 Second Peak ..., Memory | 20 Second Peak ...), per VM only.<br>\n<b style=\"font-weight:700;color:#ffffff\">Worst VM and % of VMs facing</b>: cluster and host rollups of ready, co-stop and contention. They show\ntrouble that a cluster average hides.<br>\n<b style=\"font-weight:700;color:#ffffff\">IO wait</b> is called <b style=\"font-weight:700;color:#ffffff\">Other Wait</b> in vSphere, and is a % only per VM.<br>\n<b style=\"font-weight:700;color:#ffffff\">Memory | Contention</b> exists twice on a cluster or host, once in % and once in KB: check the unit.<br>\n<b style=\"font-weight:700;color:#ffffff\">Memory demand is not active memory.</b> Demand (Memory | Machine Demand, Host Demand, Workload %) is\nOperations' own estimate, typically 2 to 4 times Guest Active, and it drives Capacity Remaining and Time\nRemaining. VMware's tiering guidance sizes DRAM on active memory, so this dashboard does too. Use demand for\n\"is this cluster out of memory now\", active for \"how much DRAM after tiering\".</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Which VMs cannot be tiered</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">From VMware's guidance. <b style=\"font-weight:700;color:#ffffff\">Visible here</b>: full memory reservation (Reservation equal to Configured); <b style=\"font-weight:700;color:#ffffff\">monster VMs</b>, 512 GB or more configured or\n128 or more vCPUs (sort the VM table); PCI passthrough (enable in policy).\n<b style=\"font-weight:700;color:#ffd79a\">Not shown here</b>, check in vCenter: Fault Tolerance (rare), latency sensitivity High, SEV / SGX / TDX\nconfidential computing, nested virtualisation, 1 GB huge-page backing.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Matches MTAT</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">The Hosts table carries MTAT's host inputs with MTAT's own definitions: Installed GB (Physical_RAM),\nConsumed avg (Consumed_GB, average), Active peak (Active_GB, maximum), CPU avg (CPU_Pct, average). The VM\ntable carries Host, VM, Configured GB (Provisioned_GB) and Guest Active peak (Active_GB). MTAT reads\nvCenter's 7-day history; these read Operations' 30 days of 5-minute samples.</p></div>"
- id: setup
  type: TextDisplay
  title: "Complete the install"
  coords: {x: 1, y: 59, w: 12, h: 9}
  html: "<div style=\"font-family:'Metropolis','Segoe UI',sans-serif;font-size:13px;line-height:1.45;padding:12px 14px;background:#2b3137;color:#e9edf0;border-radius:6px;border:1px solid #4a535d\"><h3 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Complete the install</h3>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">The pak adds the views and this dashboard. Two steps need doing by hand, once.</p>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffffff\">1. Add the adapter instance.</b> Administration → Integrations → Repository → click\n<b style=\"font-weight:700;color:#ffffff\">Memory Tier Advanced</b> → <b style=\"font-weight:700;color:#ffffff\">ADD ACCOUNT</b>. Type a Name, leave Label and Collector as\nthey are, click <b style=\"font-weight:700;color:#ffffff\">ADD</b>. It collects nothing and turns green within a few minutes. After an\nupgrade, check it under Integrations → Accounts; if it shows stopped, choose <b style=\"font-weight:700;color:#ffffff\">Start Collecting</b>.</p>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffffff\">2. Turn on two VM metrics in the active policy.</b></p>\n<ol style=\"margin:4px 0 4px 20px;padding:0;color:#e9edf0\">\n<li style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Open <b style=\"font-weight:700;color:#ffffff\">Policy Definition</b>: on 8.18, Operations → Configurations; on 9.x,\nAdministration → Configurations.</li>\n<li style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Click the policy whose Status is <b style=\"font-weight:700;color:#ffffff\">Active</b> (normally Default Policy), then\n<b style=\"font-weight:700;color:#ffffff\">EDIT POLICY</b> → <b style=\"font-weight:700;color:#ffffff\">Metrics and Properties</b>.</li>\n<li style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Select Object Type: <code style=\"font-family:monospace;background:#363d45;color:#8fd3ff;padding:1px 3px;border-radius:3px\">Virtual Machine</code> (vCenter → Virtual Machine).</li>\n<li style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Filter <code style=\"font-family:monospace;background:#363d45;color:#8fd3ff;padding:1px 3px;border-radius:3px\">Guest Active</code>, click Expand All, and set <b style=\"font-weight:700;color:#ffffff\">Memory → Guest Active\n(KB)</b> to <b style=\"font-weight:700;color:#ffffff\">Activated</b>. 8.18 only; 9.x collects it already.</li>\n<li style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Filter <code style=\"font-family:monospace;background:#363d45;color:#8fd3ff;padding:1px 3px;border-radius:3px\">PCI</code> and set <b style=\"font-weight:700;color:#ffffff\">Configuration → Security → PCI PassThrough</b> to\n<b style=\"font-weight:700;color:#ffffff\">Activated</b>. Both versions.</li>\n<li style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Click <b style=\"font-weight:700;color:#ffffff\">SAVE</b>.</li>\n</ol>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffd79a\">Until step 2,</b> the VM Guest Active and PCI passthrough columns stay blank. Their\nhistory starts when you save; Guest Active fills in within about 5 minutes. No super metrics are needed.</p></div>"
