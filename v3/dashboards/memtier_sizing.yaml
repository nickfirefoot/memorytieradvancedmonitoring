- id: help
  type: TextDisplay
  title: "How to read this"
  coords: {x: 1, y: 25, w: 12, h: 22}
  html: "<div style=\"font-family:'Metropolis','Segoe UI',sans-serif;font-size:13px;line-height:1.45;padding:12px 14px;background:#2b3137;color:#e9edf0;border-radius:6px;border:1px solid #4a535d\"><h3 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Memory tiering sizing (Aria Operations 8.18)</h3>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffffff\">Click a cluster</b> in the top table; the hosts and powered-on VMs below follow it. Every\ncolumn covers the <b style=\"font-weight:700;color:#ffffff\">last 30 days</b>. <b style=\"font-weight:700;color:#ffffff\">Peak</b> = the highest 5-minute average in that window\n(Operations keeps no finer peak for memory). <b style=\"font-weight:700;color:#ffffff\">P95</b> = the value 95% of 5-minute samples stay under.\n<b style=\"font-weight:700;color:#ffffff\">Avg</b> = the 30-day mean. <b style=\"font-weight:700;color:#ffffff\">Now</b> = the latest sample.</p>\n\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffd79a\">vMotion and maintenance-mode spikes.</b> Measured on a lab: after a vMotion the\ndestination host counts the arriving VM's active memory at about <b style=\"font-weight:700;color:#ffffff\">double</b> for roughly\n<b style=\"font-weight:700;color:#ffffff\">10 minutes</b>, so the cluster's Guest Active reads high by about that VM's working set. A\nmaintenance-mode evacuation moves a whole host's VMs, so the cluster can read high by up to that host's\nactive memory for a similar time. The <b style=\"font-weight:700;color:#ffffff\">peak</b> may therefore be a migration artefact.\n<b style=\"font-weight:700;color:#ffffff\">P95</b> drops all short spikes, real or not. The vMotion columns are 30-day maxima with no time\nlink to the peak, so they only show that migrations happen. <b style=\"font-weight:700;color:#ffffff\">To decide:</b> open the cluster's\nMetrics chart and plot Memory | Guest Active with Summary | Number of vMotions over the same 30 days. If\nthe peak sits on a vMotion burst or maintenance window, size on P95; otherwise size on the peak.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Clusters</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffffff\">Running hosts / All hosts</b>: hosts connected and out of maintenance, and all hosts.\nInstalled memory and the sizing use <b style=\"font-weight:700;color:#ffffff\">Running hosts</b>: a host that is down or in maintenance\nreports no memory. <b style=\"font-weight:700;color:#ffffff\">Running VMs / All VMs</b>: All VMs includes powered-off VMs and templates.<br>\n<b style=\"font-weight:700;color:#ffffff\">Installed GB</b> (Memory | Total Capacity): physical DRAM in the cluster's hosts. On a host already\ntiered it would include the NVMe tier; on ESXi 8 it is DRAM.<br>\n<b style=\"font-weight:700;color:#ffffff\">Available to VMs GB</b> (Memory | Capacity Available to VMs): installed minus what ESXi keeps for itself.<br>\n<b style=\"font-weight:700;color:#ffffff\">Guest Active total</b> (Memory | Guest Active): the cluster's working set, the hosts' active\nmemory added together at the same moment. It is the basis of the DRAM figure. It is ESXi's sampled\nestimate and is <b style=\"font-weight:700;color:#ffffff\">not</b> the sum of the VMs' own Guest Active (hosts measure machine memory after\npage sharing). Shown as now, peak, P95 and average.<br>\n<b style=\"font-weight:700;color:#ffffff\">vMotions / DRS vMotions</b> (max per 5 min): migration activity; read it beside the active peak.<br>\n<b style=\"font-weight:700;color:#ffffff\">Consumed</b> (Memory | Consumed): host memory backing the guests. Includes memory the guest touched once\nand never released, so it is usually far above active. Cold memory = consumed minus active.<br>\n<b style=\"font-weight:700;color:#ffffff\">Memory usage %</b>: consumed as a share of capacity.<br>\n<b style=\"font-weight:700;color:#ffffff\">Worst VM mem contention %</b>: the worst any VM waited for memory. Non-zero means memory is already short.<br>\n<b style=\"font-weight:700;color:#ffffff\">Balloon, Swap-in/out rate, Compressed</b>: ESXi reclaiming memory today. Any non-zero value means the\ncluster is already short of DRAM; tier only after that is understood.<br>\n<b style=\"font-weight:700;color:#ffffff\">VM overhead</b>: memory ESXi uses to run the VMs; stays in DRAM.<br>\n<b style=\"font-weight:700;color:#ffffff\">CPU avg / peak %</b> (CPU | Capacity Usage), <b style=\"font-weight:700;color:#ffffff\">CPU used / demand MHz</b>, <b style=\"font-weight:700;color:#ffffff\">Worst VM CPU ready %</b>,\n<b style=\"font-weight:700;color:#ffffff\">VMs facing CPU ready %</b>: CPU headroom. Tiering only pays where memory runs out before CPU.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Hosts</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Only hosts that are connected and not in maintenance; a down host would otherwise add a blank row.\nThe same memory and CPU columns per host, to spot imbalance: a cluster that only fits because one host is\nnearly empty. <b style=\"font-weight:700;color:#ffffff\">CPU ready ms</b> is time VMs waited for a CPU. Total row: installed GB.<br>\n<b style=\"font-weight:700;color:#ffffff\">IO wait</b> (vSphere's Other Wait): time vCPUs sat stalled on storage or network IO.\n<b style=\"font-weight:700;color:#ffffff\">Swap wait</b>: time spent waiting for swapped-out memory. High IO wait means the workload is\nIO-bound: guest-OS tools report that time as busy CPU, so read CPU figures with it, and tiering memory\nwill not fix it.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Powered-on VMs</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\"><b style=\"font-weight:700;color:#ffffff\">Configured GB</b> (Memory | Total Capacity): memory given to the VM. The Total row is\n<b style=\"font-weight:700;color:#ffffff\">allocated</b>, the amount the tiered design must present. Powered-off VMs are excluded.<br>\n<b style=\"font-weight:700;color:#ffffff\">Guest Active peak</b>: per-VM Guest Active. <b style=\"font-weight:700;color:#ffd79a\">Not collected by default on 8.18</b>: blank until\nenabled in the policy (Operations &rarr; Configurations &rarr; Policy Definition &rarr; the Active policy &rarr; EDIT POLICY &rarr;\nMetrics and Properties &rarr; Virtual Machine &rarr; Memory | Guest Active (KB) &rarr; Activated &rarr; SAVE), and its history\nstarts then. Do not add per-VM peaks together: they happen at different times. Use the cluster total.<br>\n<b style=\"font-weight:700;color:#ffffff\">Non Zero Active peak</b>: collected by default, so it has the 30 days; use it per VM until Guest Active\nhas history.<br>\n<b style=\"font-weight:700;color:#ffffff\">Consumed peak</b>: host memory backing this VM.<br>\n<b style=\"font-weight:700;color:#ffffff\">Reserved used GB / Reservation / Memory limit</b>: a VM whose reservation equals its configured memory is\n<b style=\"font-weight:700;color:#ffd79a\">pinned to DRAM</b> and cannot be tiered; subtract it. Latency-sensitive VMs are also pinned and are not\nvisible here; check them by hand.<br>\n<b style=\"font-weight:700;color:#ffffff\">Host / Guest OS / vCPUs</b>: where it runs and what it is; vCPUs and Configured GB identify monster VMs.<br>\n<b style=\"font-weight:700;color:#ffffff\">Swapped, Swap-in rate, Compressed, Guest page-out 20s peak</b>: this VM is already short of memory.<br>\n<b style=\"font-weight:700;color:#ffffff\">Oversized / Undersized by</b>: Operations' right-sizing view of the VM.<br>\n<b style=\"font-weight:700;color:#ffffff\">Mem contention / CPU ready 20s peak, CPU co-stop</b>: the worst moment inside a collection cycle.<br>\n<b style=\"font-weight:700;color:#ffffff\">IO wait avg / 20s peak, Swap wait</b>: this VM stalled on IO, or on swapped memory. A VM with high\nIO wait looks CPU-busy from inside the guest without using the CPU.<br>\n<b style=\"font-weight:700;color:#ffffff\">Worst disk read / write latency, Disk latency 20s peak</b>: the slowest of this VM's virtual disks.\nThese are measured in ESXi's storage stack, so they read the same on vSAN, VMFS (FC or iSCSI), NFS and\nvVols; datastore-level latency is not reported for vSAN VMs. High IO wait with high disk latency: the\nwait is storage, so open the VM's Metrics page to see which disk and datastore. High IO wait with low\ndisk latency: it is most likely network.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">The sizing</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">Per cluster, A = Active peak (or P95, see above), H = Running hosts, V = VM Total configured GB, I = Installed GB,\n<b style=\"font-weight:700;color:#ffffff\">R = reserve</b> = Installed GB &minus; Available to VMs GB: the memory ESXi keeps for the hypervisor, vSAN\nand NSX, measured by Operations, resident and never tierable.\n<b style=\"font-weight:700;color:#ffffff\">VMware's rule</b>: active memory should be <b style=\"font-weight:700;color:#ffffff\">50% or less of DRAM</b>, so the\n<b style=\"font-weight:700;color:#ffffff\">recommended DRAM</b> = 2 &times; A + R. <b style=\"font-weight:700;color:#ffffff\">Floor</b> (1 &times; A + R) is the\nabsolute minimum and sits below VMware's guidance. <b style=\"font-weight:700;color:#ffffff\">Conservative</b> = 4 &times; A + R.\n<b style=\"font-weight:700;color:#ffffff\">NVMe needed</b> = V &minus; DRAM; per host it must stay under <b style=\"font-weight:700;color:#ffffff\">4,096 GB</b>.\n<b style=\"font-weight:700;color:#ffffff\">Retrofit headroom</b> = I &minus; DRAM: positive means NVMe alone is enough. Export the tables (Export as CSV) and <code style=\"font-family:monospace;background:#363d45;color:#8fd3ff;padding:1px 3px;border-radius:3px\">memtier_818_calc.py</code>\nprints all of it.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Which VMs cannot be tiered</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">From VMware's guidance. <b style=\"font-weight:700;color:#ffffff\">Visible here</b>: full memory reservation (Reservation equal to Configured); <b style=\"font-weight:700;color:#ffffff\">monster VMs</b>, 512 GB or more configured or\n128 or more vCPUs (sort the VM table); PCI passthrough (enable in policy).\n<b style=\"font-weight:700;color:#ffd79a\">Not shown here</b>, check in vCenter: Fault Tolerance (rare), latency sensitivity High, SEV / SGX / TDX\nconfidential computing, nested virtualisation, 1 GB huge-page backing.</p>\n\n<h4 style=\"font-size:15px;margin:4px 0 10px 0;color:#ffffff\">Matches MTAT</h4>\n<p style=\"margin:5px 0;line-height:1.45;color:#e9edf0\">The Hosts table carries MTAT's host inputs with MTAT's own definitions: Installed GB (Physical_RAM),\nConsumed avg (Consumed_GB, average), Active peak (Active_GB, maximum), CPU avg (CPU_Pct, average). The VM\ntable carries Host, VM, Configured GB (Provisioned_GB) and Guest Active peak (Active_GB). MTAT reads\nvCenter's 7-day history; these read Operations' 30 days of 5-minute samples.</p></div>"
